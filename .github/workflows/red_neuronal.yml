# Integración continua del clasificador (funcionalidad 010, CA20).
#
# Corre análisis estático y pruebas sin GPU ni descarga de datos cada vez que
# cambia red_neuronal/ o este archivo. Se prueba en Python 3.11 (versión de la
# imagen de Kaggle) y 3.12 (versión del backend en Ubuntu 24.04).
# Realiza: RNF19, RNF20.
name: Red neuronal

on:
  push:
    paths:
      - "red_neuronal/**"
      - ".github/workflows/red_neuronal.yml"
  pull_request:
    paths:
      - "red_neuronal/**"
      - ".github/workflows/red_neuronal.yml"

permissions:
  contents: read

jobs:
  calidad:
    name: Calidad (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: red_neuronal

    steps:
      - name: Obtener el código
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: red_neuronal/pyproject.toml

      - name: Instalar PyTorch para CPU
        # La versión con CUDA pesa varios GB y no se usa: en CI no hay GPU.
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Instalar el paquete
        run: pip install -e ".[entrenamiento,desarrollo]"

      - name: Análisis estático con flake8
        run: flake8 clasificador/ pruebas/

      - name: Análisis estático con pylint
        run: pylint clasificador/

      - name: Pruebas y cobertura
        env:
          MLFLOW_DISABLE_AGENT_HINT: "1"
        run: pytest --cov=clasificador --cov-report=term-missing --cov-fail-under=80
