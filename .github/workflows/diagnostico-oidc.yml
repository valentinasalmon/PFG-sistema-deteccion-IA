# Diagnóstico temporal del acceso de GitHub Actions a AWS (funcionalidad 017).
# Se borra al resolver el problema.
name: Diagnóstico OIDC

on:
  push:
    branches: [correccion/017-despliegue-oidc]

jobs:
  diagnostico:
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Identidad que GitHub presenta ante AWS
        run: |
          token=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          carga=$(echo "$token" | cut -d. -f2 | tr '_-' '/+')
          while [ $(( ${#carga} % 4 )) -ne 0 ]; do carga="$carga="; done
          echo "$carga" | base64 -d | jq '{iss, sub, aud, ref, repository, repository_owner, repository_id, job_workflow_ref}'
          echo "Rol configurado: ${{ vars.AWS_ROLE_DESPLIEGUE }}"
          echo "Región: ${{ vars.AWS_REGION }}"
          aws sts assume-role-with-web-identity --role-arn "${{ vars.AWS_ROLE_DESPLIEGUE }}" \
            --role-session-name diagnostico --web-identity-token "$token" \
            --query 'AssumedRoleUser.Arn' --output text || true
