# Integración continua (RNF20).
# Se ejecuta en cada Pull Request y en cada envío a main y desarrollo.
# Un Pull Request solo puede integrarse si los tres trabajos terminan en verde.

name: Integración continua

on:
  pull_request:
  push:
    branches: [main, desarrollo]

jobs:
  backend:
    name: Backend (estilo, análisis, arquitectura y pruebas)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Instalar las bibliotecas del sistema para los PDF (WeasyPrint)
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-dejavu
      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt
      - name: Estilo (flake8)
        run: flake8 app pruebas wsgi.py
      - name: Análisis estático (pylint, mínimo 8,5)
        run: pylint app pruebas wsgi.py
      - name: Pruebas, arquitectura y cobertura mínima del 80 %
        run: pytest

  frontend:
    name: Frontend (análisis, pruebas y compilación)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Análisis estático (ESLint)
        run: npm run lint
      - name: Pruebas con cobertura (Vitest)
        run: npm run test:cobertura
      - name: Compilación
        run: npm run build

  commits:
    name: Mensajes de commit (Conventional Commits en español)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Instalar commitlint
        run: npm install --no-save @commitlint/cli@21.2.3 @commitlint/config-conventional@21.2.3
      - name: Validar los commits del Pull Request
        run: >
          npx commitlint --verbose
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
