# Ganchos de Git gestionados con pre-commit (RNF20).
# Instalación (una vez por clon, con el entorno virtual del backend activo):
#   pre-commit install --hook-type pre-commit --hook-type commit-msg
#
# - commit-msg: valida el mensaje con commitlint (tipos en español, commitlint.config.mjs).
# - pre-commit: controles rápidos sobre los archivos modificados.

# Se excluyen los skills de terceros y los archivos generados por Alembic.
exclude: ^(\.agents/|\.claude/skills/|backend/migraciones/)

repos:
  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.27.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        # Usa la misma configuración que la integración continua: commitlint.config.mjs
        additional_dependencies: ["@commitlint/config-conventional@21.2.3"]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: detect-private-key
      - id: check-merge-conflict

  - repo: https://github.com/pycqa/flake8
    rev: 7.4.1
    hooks:
      - id: flake8
        files: ^backend/
        args: ["--config", "backend/.flake8"]
