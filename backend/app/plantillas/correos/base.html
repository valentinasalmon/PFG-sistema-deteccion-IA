<!doctype html>
<html lang="es-AR">
  <body style="margin:0;padding:24px;background:#f3f4f6;font-family:Arial,Helvetica,sans-serif;color:#1f2937;">
    <table role="presentation" width="100%" style="max-width:560px;margin:0 auto;background:#ffffff;border-radius:8px;">
      <tr>
        <td style="padding:24px 32px;border-bottom:1px solid #e5e7eb;font-weight:bold;">
          Plataforma de análisis de imágenes
        </td>
      </tr>
      <tr>
        <td style="padding:24px 32px;line-height:1.5;">
          {% block contenido %}{% endblock %}
        </td>
      </tr>
      <tr>
        <td style="padding:16px 32px;border-top:1px solid #e5e7eb;font-size:12px;color:#6b7280;">
          Este es un mensaje automático; no lo respondas.
        </td>
      </tr>
    </table>
  </body>
</html>
