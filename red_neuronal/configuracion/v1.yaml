# Receta de datos y entrenamiento v1 (tarea T27).
#
# Completada el 2026-11-04 con la exploración (T25) que corrió la autora en
# Colab: revisión exacta de cada conjunto, columnas confirmadas, conteos por
# clase y por generador en 12 archivos de cada uno. Detalle y números en el
# capítulo 4 de docs/red-neuronal/ y en la bitácora del 2026-10-30.
#
# Decisiones:
#   - Community Forensics: cada archivo tiene una sola clase (2 992 imágenes)
#     y un único bloque de 0,3 a 4,1 GB. Se usan 4 archivos de reales y los 6
#     de sintéticas explorados (se evita el HFCF_small_103, de 4,1 GB). Sus
#     sintéticas son 216 generadores abiertos: 6 grandes (GAN y difusión) y
#     unos 210 ajustes finos chicos. La cuota de 500 evita que GigaGAN y
#     VQDiffusion dominen; con eso hay unas 11 600 sintéticas disponibles y se
#     piden 9 000 (margen para las descartadas por contenido explícito).
#   - OpenFake: los 12 archivos explorados mezclan reales (~2 000) y
#     sintéticas (~2 000) de 74 generadores, comerciales incluidos (GPT Image,
#     DALL·E 3, Midjourney 6, Ideogram, FLUX Pro, Seedream, Grok). La cuota de
#     700 limita a SD 3.5, SD 2.1 y FLUX dev. Sus reales son fotos grandes
#     (lado menor mediano 3 349 px, ~4 MB): por eso el búfer de mezcla es
#     chico (300), para no agotar la RAM de Colab.
#   - Generadores no vistos: la familia de Google (Imagen 4, Imagen 3 y Nano
#     Banana 2, que es lo que usa Gemini). Van completos a «no_visto» y son
#     la base de la demostración de reentrenamiento (versión 1.1.0). Son ~1,7 %
#     de las sintéticas de OpenFake: quedan en la misma fuente y el desbalance
#     que generan en el entrenamiento (~1 %) está dentro de la tolerancia.
#   - Las fotos reales de escenas del sistema (CarDD, SCIN, obras) NO se usan
#     para entrenar: van al conjunto propio, para evaluar (regla de oro).
#   - Treasure, MLLM-Generated, ShareGPT-4o y CarDD no están en Parquet (son
#     carpetas de imágenes o archivos .tar): no entran en esta versión.
#     ConstructionSite espera la aprobación del acceso. Semi-Truths no declara
#     una licencia verificable.
#
# Total: 19 000 reales y 19 000 sintéticas (≈ 3,8 veces la prueba de concepto),
# de las que ~170 sintéticas de Google quedan como «no vistas».

nombre: v1
semilla: 42
datos:
  fuentes:
    - nombre: community_forensics
      tipo: hugging_face
      conjunto: OwensLab/CommunityForensics-Small
      revision: 6c539a534c07917307c381f5af4053c6091b5278
      columna_imagen: image_data
      columna_clase: label
      valores_sinteticos: ["1"]
      columna_generador: model_name
      excluir: { nsfw_flag: ["True"] }   # contenido explícito: no se usa
      archivos:
        # reales (2 992 cada uno)
        - data/HFCF_small_118.parquet
        - data/HFCF_small_121.parquet
        - data/HFCF_small_123.parquet
        - data/HFCF_small_154.parquet
        # sintéticas (2 992 o 2 993 cada uno)
        - data/HFCF_small_13.parquet
        - data/HFCF_small_15.parquet
        - data/HFCF_small_57.parquet
        - data/HFCF_small_68.parquet
        - data/HFCF_small_79.parquet
        - data/HFCF_small_88.parquet
      cuota_por_generador: 500
      bufer_mezcla: 1000
      cantidad_reales: 9000
      cantidad_sinteticas: 9000
      licencia: CC BY-NC-SA 4.0 (ficha de la revisión 6c539a5)

    - nombre: openfake
      tipo: hugging_face
      conjunto: ComplexDataLab/OpenFake
      revision: 3247b942f18d39d1fd476b1077852af033d35d8c
      columna_imagen: image
      columna_clase: label
      valores_sinteticos: ["fake"]
      columna_generador: model
      archivos:
        - core/train-00000-of-00032-00012.parquet
        - core/train-00001-of-00032-00000.parquet
        - core/train-00004-of-00032-00000.parquet
        - core/train-00004-of-00032-00015.parquet
        - core/train-00005-of-00032-00006.parquet
        - core/train-00006-of-00032-00015.parquet
        - core/train-00011-of-00032-00006.parquet
        - core/train-00012-of-00032-00009.parquet
        - core/train-00014-of-00032-00002.parquet
        - core/train-00022-of-00032-00001.parquet
        - core/train-00028-of-00032-00013.parquet
        - core/train-00031-of-00032-00002.parquet
      cuota_por_generador: 700
      bufer_mezcla: 300
      cantidad_reales: 10000
      cantidad_sinteticas: 10000
      licencia: CC BY-NC 4.0 (ficha de la revisión 3247b94)

  # Familia de Google (Gemini): nunca se usa para entrenar ni validar.
  generadores_reservados: ["imagen-4.0", "imagen-3.0-002", "nano-banana-2"]
  proporciones: { entrenamiento: 0.8, validacion: 0.1, prueba: 0.1 }
  calidad_jpeg: [75, 95]
  lado_menor: [256, 512]

entrenamiento:
  arquitectura: efficientnet_b0
  epocas: 15
  tamanio_lote: 64
  tasa_aprendizaje: 0.0003
  paciencia: 3
  trabajadores_carga: 4
  precision_mixta: true

exportacion: { opset: 18, tolerancia: 0.001 }
compuerta: { auc_minimo: 0.90 }
