  # Familia de Google (Gemini): nunca se usa para entrenar ni validar.
  generadores_reservados: ["imagen-4.0", "imagen-3.0-002", "nano-banana-2"]
  proporciones: { entrenamiento: 0.8, validacion: 0.1, prueba: 0.1 }
  calidad_jpeg: [75, 95]
  lado_menor: [256, 512]
  # Las imágenes con el lado menor por debajo de 256 px se descartan al obtener:
  # al normalizar habría que agrandarlas, y la interpolación deja marcas propias.
  lado_menor_minimo: 256

entrenamiento:
  arquitectura: efficientnet_b0
  epocas: 15
  tamanio_lote: 64
  tasa_aprendizaje: 0.0003
  paciencia: 3
  trabajadores_carga: 4
  precision_mixta: true

exportacion: { opset: 18, tolerancia: 0.001 }
compuerta: { auc_minimo: 0.90 }
