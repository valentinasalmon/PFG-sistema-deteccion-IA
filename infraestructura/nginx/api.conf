# Rutas de la API detrás de Gunicorn, con sus límites de pedidos (030).
# Se instala en /etc/nginx/snippets/ y la incluyen las dos configuraciones
# del sitio (con y sin TLS). Las zonas están en limites.conf.

proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_read_timeout 120s;
limit_conn conexiones 30;

# Respuesta de "demasiados pedidos" en el mismo formato JSON que la API,
# para que la interfaz muestre el mensaje como cualquier otro error.
error_page 429 = @demasiados_pedidos;
location @demasiados_pedidos {
    default_type application/json;
    return 429 '{"mensaje":"Hiciste demasiados intentos seguidos. Esperá un minuto y volvé a probar.","codigo":"demasiados_pedidos"}';
}

location /api/ {
    limit_req zone=api burst=40 nodelay;
    proxy_pass http://127.0.0.1:8000;
}

location = /api/sesion {
    limit_req zone=acceso burst=10 nodelay;
    limit_req zone=api burst=40 nodelay;
    proxy_pass http://127.0.0.1:8000;
}

location /api/cuentas/ {
    limit_req zone=acceso burst=10 nodelay;
    proxy_pass http://127.0.0.1:8000;
}

location /api/google/ {
    limit_req zone=google burst=10 nodelay;
    proxy_pass http://127.0.0.1:8000;
}

location /api/verificacion {
    limit_req zone=publica burst=20 nodelay;
    proxy_pass http://127.0.0.1:8000;
}

# Hasta 30 fotos seguidas desde el celular (RF53).
location /api/carga/ {
    limit_req zone=publica burst=40 nodelay;
    proxy_pass http://127.0.0.1:8000;
}

# Página de pago del plan (032): consulta el estado cada pocos segundos.
location /api/pagos/ {
    limit_req zone=publica burst=30 nodelay;
    proxy_pass http://127.0.0.1:8000;
}
