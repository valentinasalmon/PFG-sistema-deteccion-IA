# Límites de pedidos por dirección IP (funcionalidad 030, RNF01 CA3, RNF02).
# Se instala en /etc/nginx/conf.d/, dentro del bloque http. Frenan los ataques
# de fuerza bruta y el abuso de las páginas públicas antes de llegar a Flask;
# el bloqueo de la cuenta tras 5 contraseñas incorrectas sigue igual.

# Para el acceso solo cuentan los envíos (POST): GET /api/sesion se consulta
# al abrir cada pantalla y no debe agotar el límite. Una clave vacía no cuenta.
map $request_method $ip_si_envia {
    POST    $binary_remote_addr;
    default "";
}

# Inicio de sesión, registro, verificación y recuperación de la contraseña.
limit_req_zone $ip_si_envia        zone=acceso:10m  rate=20r/m;
# Inicio y registro con Google (027).
limit_req_zone $binary_remote_addr zone=google:10m  rate=20r/m;
# Páginas sin sesión: verificación de informes (026) y carga desde el celular (024).
limit_req_zone $binary_remote_addr zone=publica:10m rate=60r/m;
# Resto de la API, con margen para el uso normal de la interfaz.
limit_req_zone $binary_remote_addr zone=api:10m     rate=20r/s;
# Conexiones simultáneas por IP.
limit_conn_zone $binary_remote_addr zone=conexiones:10m;

limit_req_status 429;
limit_conn_status 429;
