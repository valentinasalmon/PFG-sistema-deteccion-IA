# Nginx de producción (RNF02, RNF22 CA3): HTTPS con TLS 1.2 o superior,
# redirección desde HTTP, cabeceras de seguridad, la interfaz compilada y la
# API detrás de Gunicorn. __DOMINIO__ lo reemplaza instalar_configuracion.sh.

server {
    listen 80;
    listen [::]:80;
    server_name __DOMINIO__;

    # Renovación del certificado.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __DOMINIO__;

    ssl_certificate /etc/letsencrypt/live/__DOMINIO__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMINIO__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;

    # Imágenes de hasta 20 MB (RN22) más el resto del formulario.
    client_max_body_size 25m;
    server_tokens off;

    # Cabeceras de seguridad (RNF02 CA1 y CA4). Las imágenes y los PDF llegan
    # desde S3 con enlaces firmados, por eso se permite *.amazonaws.com.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.amazonaws.com; connect-src 'self' https://tsaapi.bfa.ar; font-src 'self' data:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    root /opt/plataforma/actual/frontend/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Archivos compilados con huella en el nombre: se pueden guardar en caché.
    location /assets/ {
        expires 1y;
    }

    # La interfaz es una aplicación de una sola página: toda ruta carga index.html.
    location / {
        try_files $uri /index.html;
    }
}
