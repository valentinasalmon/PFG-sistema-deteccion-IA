# Configuración provisoria en HTTP, solo hasta obtener el certificado
# (scripts/pedir_certificado.sh). La sesión exige HTTPS (RNF02 CA2), así que
# en este modo se puede ver la plataforma pero no iniciar sesión.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMINIO__;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    root /opt/plataforma/actual/frontend/dist;
    index index.html;
    client_max_body_size 25m;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri /index.html;
    }
}
