# Configuración provisoria en HTTP, solo hasta obtener el certificado
# (scripts/pedir_certificado.sh). La sesión exige HTTPS (RNF02 CA2), así que
# en este modo se puede ver la plataforma pero no iniciar sesión.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMINIO__;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    root /opt/plataforma/actual/frontend/dist;
    index index.html;
    client_max_body_size 25m;

    # API con límites de pedidos por IP (030): ver api.conf y limites.conf.
    include /etc/nginx/snippets/plataforma-api.conf;

    location / {
        try_files $uri /index.html;
    }
}
